---
# DeepSeek（OpenAI 兼容，国内直连）
# kubectl create secret generic deepseek-creds --namespace kagent --from-literal=apiKey=sk-xxx
apiVersion: kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: my-model-config
  namespace: kagent
spec:
  provider: OpenAI
  model: deepseek-chat
  openAI:
    baseUrl: https://api.deepseek.com/v1
  apiKeySecret: deepseek-creds
  apiKeySecretKey: apiKey
