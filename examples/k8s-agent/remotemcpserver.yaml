apiVersion: kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: k8s-mcp
  namespace: kagent
spec:
  description: kagent-tools MCP server for kubectl, helm, istio, etc.
  # 默认指向 kagent Helm 自动部署的 kagent-tools 服务
  # 执行 make helm-install 后自动创建
  url: http://kagent-tool-server.kagent.svc:8084/mcp
