name: skill-publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skills
        run: |
          for s in skills/*/; do
            [ -f "$s/SKILL.md" ] || { echo "missing SKILL.md in $s"; exit 1; }
          done

      - name: Lint scripts
        run: |
          if compgen -G "skills/*/scripts/*.sh" > /dev/null; then
            shellcheck skills/*/scripts/*.sh
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push OCI
        run: |
          # Replace with your OCI tool of choice (oras / flux operator skills publish)
          oras push "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" ./skills
